name: thesis_repo_renew
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  file_picker: ^10.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
