name: thesis_repo_renew
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  desktop_drop:
    ^0.8.4
  file_picker: ^10.1.0
  flutter:
    sdk: flutter
  flutter_dropzone: ^4.2.1
  flutter_secure_storage: ^10.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.9.1

  material_ui: ^1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansSymbols-Regular.ttf
    - assets/fonts/NotoSansSymbols2-Regular.ttf
    - assets/Achievement Badges/
